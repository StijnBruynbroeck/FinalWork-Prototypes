				font-family: "Courier New", monospace;
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 40px 20px;
			}
			h1 {
				color: #00ff41;
				font-size: 28px;
				letter-spacing: 4px;
				margin-bottom: 8px;
				text-transform: uppercase;
			}
			.subtitle {
				color: #555;
				font-size: 13px;
				margin-bottom: 40px;
				letter-spacing: 2px;
			}
			.charts {
				display: flex;
				gap: 40px;
				flex-wrap: wrap;
				justify-content: center;
			}
			.chart-card {
				background: #111118;
				border: 1px solid #1a1a2e;
				border-radius: 8px;
				padding: 30px;
				box-shadow: 0 0 30px rgba(0, 255, 65, 0.03);
			}
			.chart-card h2 {
				color: #00ff41;
				font-size: 16px;
				letter-spacing: 2px;
				margin-bottom: 20px;
				text-transform: uppercase;
				border-bottom: 1px solid #1a1a2e;
				padding-bottom: 10px;
			}
			canvas {
				display: block;
			}
			.legend {
				display: flex;
				gap: 20px;
				margin-top: 16px;
				font-size: 11px;
				color: #888;
			}
			.legend span {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.legend .dot {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				display: inline-block;
			}
			.stats-bar {
				margin-top: 40px;
				display: flex;
				gap: 30px;
				flex-wrap: wrap;
				justify-content: center;
			}
			.stat {
				background: #111118;
				border: 1px solid #1a1a2e;
				border-radius: 6px;
				padding: 20px 30px;
				text-align: center;
			}
			.stat .value {
				color: #00ff41;
				font-size: 32px;
				font-weight: bold;
			}
			.stat .label {
				color: #555;
				font-size: 11px;
				margin-top: 4px;
				letter-spacing: 1px;
				text-transform: uppercase;
			}

			const total = csvData.length;
			const successCount = csvData.filter((d) => d.score >= 80).length;
			const avgScore = Math.round(
				csvData.reduce((s, d) => s + d.score, 0) / total,
			);
			const avgLatency = "N/A";
			const successRate = Math.round((successCount / total) * 100);

			document.getElementById("stat-total").textContent = total;
			document.getElementById("stat-success").textContent = successCount;
			document.getElementById("stat-avg").textContent = avgScore;
			document.getElementById("stat-latency").textContent = avgLatency;
			document.getElementById("stat-rate").textContent = successRate + "%";

			function getCategory(score, prefab) {
				if (prefab === "none" || score < 20) return "fail";
				if (score >= 80) return "success";
				return "marginal";
			}

			function getColor(cat) {
				if (cat === "success") return "#00ff41";
				if (cat === "marginal") return "#ffa500";
				return "#ff3333";
			}

			// ── SCATTERPLOT ──
			(function () {
				const canvas = document.getElementById("scatter");
				const ctx = canvas.getContext("2d");
				const W = canvas.width,
					H = canvas.height;
				const pad = { top: 20, right: 30, bottom: 50, left: 60 };
				const plotW = W - pad.left - pad.right;
				const plotH = H - pad.top - pad.bottom;

				ctx.fillStyle = "#111118";
				ctx.fillRect(0, 0, W, H);

				// grid
				ctx.strokeStyle = "#1a1a2e";
				ctx.lineWidth = 1;
				for (let i = 0; i <= 5; i++) {
					const y = pad.top + (plotH / 5) * i;
					ctx.beginPath();
					ctx.moveTo(pad.left, y);
					ctx.lineTo(W - pad.right, y);
					ctx.stroke();
					const x = pad.left + (plotW / 5) * i;
					ctx.beginPath();
					ctx.moveTo(x, pad.top);
					ctx.lineTo(x, H - pad.bottom);
					ctx.stroke();
				}

				// axes labels
				ctx.fillStyle = "#555";
				ctx.font = "11px Courier New";
				ctx.textAlign = "center";
				ctx.fillText(
					"Test Nummer (chronologisch)",
					pad.left + plotW / 2,
					H - 5,
				);
				ctx.save();
				ctx.translate(15, pad.top + plotH / 2);
				ctx.rotate(-Math.PI / 2);
				ctx.fillText("Score (0–100)", 0, 0);
				ctx.restore();

				// axis ticks
				ctx.fillStyle = "#444";
				ctx.font = "10px Courier New";
				ctx.textAlign = "center";
				for (let i = 0; i <= 5; i++) {
					const x = pad.left + (plotW / 5) * i;
					ctx.fillText(Math.round((total / 5) * i), x, H - pad.bottom + 15);
				}
				ctx.textAlign = "right";
				for (let i = 0; i <= 5; i++) {
					const y = pad.top + plotH - (plotH / 5) * i;
					ctx.fillText((100 / 5) * i, pad.left - 8, y + 4);
				}

				// data points
				for (let i = 0; i < csvData.length; i++) {
					const d = csvData[i];
					const cat = getCategory(d.score, d.prefab);
					const x = pad.left + (i / (total - 1)) * plotW;
					const y = pad.top + plotH - (d.score / 100) * plotH;

					ctx.beginPath();
					ctx.arc(x, y, cat === "success" ? 6 : 5, 0, Math.PI * 2);
					ctx.fillStyle = getColor(cat);
					ctx.fill();

					if (cat === "success") {
						ctx.beginPath();
						ctx.arc(x, y, 10, 0, Math.PI * 2);
						ctx.strokeStyle = "rgba(0,255,65,0.15)";
						ctx.lineWidth = 1;
						ctx.stroke();
					}
				}

				// threshold line at 80
				const y80 = pad.top + plotH - (80 / 100) * plotH;
				ctx.setLineDash([4, 4]);
				ctx.strokeStyle = "rgba(0,255,65,0.3)";
				ctx.lineWidth = 1;
				ctx.beginPath();
				ctx.moveTo(pad.left, y80);
				ctx.lineTo(W - pad.right, y80);
				ctx.stroke();
				ctx.setLineDash([]);

				ctx.fillStyle = "rgba(0,255,65,0.4)";
				ctx.font = "10px Courier New";
				ctx.textAlign = "left";
				ctx.fillText("plausibel (≥80)", W - pad.right - 80, y80 - 6);
			})();

			// ── HISTOGRAM ──
			(function () {
				const bins = [
					{
						label: "0–20",
						count: csvData.filter((d) => d.score >= 0 && d.score <= 20).length,
					},
					{
						label: "21–40",
						count: csvData.filter((d) => d.score >= 21 && d.score <= 40).length,
					},
					{
						label: "41–60",
						count: csvData.filter((d) => d.score >= 41 && d.score <= 60).length,
					},
					{
						label: "61–80",
						count: csvData.filter((d) => d.score >= 61 && d.score <= 80).length,
					},
					{
						label: "81–100",
						count: csvData.filter((d) => d.score >= 81 && d.score <= 100)
							.length,
					},
				];

				const canvas = document.getElementById("histogram");
				const ctx = canvas.getContext("2d");
				const W = canvas.width,
					H = canvas.height;
				const pad = { top: 20, right: 30, bottom: 50, left: 60 };
				const plotW = W - pad.left - pad.right;
				const plotH = H - pad.top - pad.bottom;

				ctx.fillStyle = "#111118";
				ctx.fillRect(0, 0, W, H);

				const maxCount = Math.max(...bins.map((b) => b.count));

				// grid
				ctx.strokeStyle = "#1a1a2e";
				ctx.lineWidth = 1;
				for (let i = 0; i <= 5; i++) {
					const y = pad.top + (plotH / 5) * i;
					ctx.beginPath();
					ctx.moveTo(pad.left, y);
					ctx.lineTo(W - pad.right, y);
					ctx.stroke();
				}

				// bars
				const barWidth = (plotW / bins.length) * 0.6;
				const gap = (plotW / bins.length) * 0.4;

				for (let i = 0; i < bins.length; i++) {
					const b = bins[i];
					const barH = (b.count / maxCount) * plotH;
					const x = pad.left + i * (plotW / bins.length) + gap / 2;
					const y = pad.top + plotH - barH;

					// gradient bar
					const grad = ctx.createLinearGradient(x, y, x, pad.top + plotH);
					if (b.label === "81–100") {
						grad.addColorStop(0, "#00ff41");
						grad.addColorStop(1, "rgba(0,255,65,0.3)");
					} else if (b.label === "0–20") {
						grad.addColorStop(0, "#ff3333");
						grad.addColorStop(1, "rgba(255,51,51,0.3)");
					} else {
						grad.addColorStop(0, "#ffa500");
						grad.addColorStop(1, "rgba(255,165,0,0.3)");
					}

					ctx.fillStyle = grad;
					ctx.fillRect(x, y, barWidth, barH);

					// bar outline
					ctx.strokeStyle = "rgba(255,255,255,0.1)";
					ctx.lineWidth = 1;
					ctx.strokeRect(x, y, barWidth, barH);

					// count on top
					ctx.fillStyle = "#ccc";
					ctx.font = "bold 14px Courier New";
					ctx.textAlign = "center";
					ctx.fillText(b.count, x + barWidth / 2, y - 8);

					// label
					ctx.fillStyle = "#555";
					ctx.font = "11px Courier New";
					ctx.fillText(b.label, x + barWidth / 2, H - pad.bottom + 20);
				}

				// y axis
				ctx.fillStyle = "#444";
				ctx.font = "10px Courier New";
				ctx.textAlign = "right";
				for (let i = 0; i <= 5; i++) {
					const y = pad.top + plotH - (plotH / 5) * i;
					ctx.fillText(Math.round((maxCount / 5) * i), pad.left - 8, y + 4);
				}

				// axis label
				ctx.fillStyle = "#555";
				ctx.font = "11px Courier New";
				ctx.textAlign = "center";
				ctx.fillText("Aantal Tests", pad.left + plotW / 2, H - 5);
			})();
